
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ночь в музее</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <section class="event-card">
            <h1 id="event-title">Ночь в музее</h1>

            <p>Дата: 15 ноября, 18:30</p>
            <p>Место: Музей космонавтики, проспект Мира, 111</p>
            <p>Вечерняя программа с выставкой и экскурсиями</p>

            <button id="show-program" type="button">
                Показать программу
            </button>

            <div id="program" hidden></div>
        </section>

        <section class="services-card">
            <h2>Дополнительные услуги</h2>

            <form id="service-form" hidden>
                <label>
                    <input type="checkbox" id="guide">
                    Экскурсия с гидом — 500 руб.
                </label>

                <label>
                    <input type="checkbox" id="audio">
                    Аудиогид — 350 руб.
                </label>

                <label>
                    <input type="checkbox" id="catalog">
                    Каталог выставки — 250 руб.
                </label>

                <button type="submit">
                    Рассчитать стоимость
                </button>
            </form>

            <p id="choice-error" class="error" hidden></p>
            <p id="data-error" class="error" hidden></p>

            <div id="result" class="result" hidden></div>
            <pre id="report-json" class="json-report" hidden></pre>
        </section>

    </main>

    <script src="app.js"></script>
</body>
</html>
